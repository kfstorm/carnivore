name: Release Acceptance

on:
  push:
    tags:
      - "v*-rc*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to validate (defaults to the dispatch ref)"
        required: false
        default: ""
        type: string
      publish_rc:
        description: "Publish a verified RC (manual dispatch only; defaults to validation-only)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  REGISTRY_IMAGE: ghcr.io/kfstorm/carnivore

concurrency:
  group: carnivore-release-candidate
  cancel-in-progress: false

jobs:
  build-candidate:
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      image: ${{ steps.meta.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
      platform_digests: ${{ steps.manifest.outputs.platform_digests }}
      commit: ${{ steps.source.outputs.commit }}
      release_tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Checkout candidate ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Validate release-candidate tag
        id: release
        env:
          REQUESTED_REF: ${{ inputs.ref }}
          EVENT_REF: ${{ github.ref_name }}
          PUBLISH_RC: ${{ github.event_name == 'push' || inputs.publish_rc }}
        run: |
          set -euo pipefail
          tag="${REQUESTED_REF:-${EVENT_REF}}"
          tag="${tag##*/}"
          if [[ "${PUBLISH_RC}" == "true" ]]; then
            python scripts/release.py validate-tag --tag "${tag}" --channel rc
            echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          else
            echo "Validation-only run for ${tag}"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set candidate image
        id: meta
        env:
          PUBLISH_RC: ${{ github.event_name == 'push' || inputs.publish_rc }}
        run: |
          set -euo pipefail
          if [[ "${PUBLISH_RC}" == "true" ]]; then
            image_kind=rc
          else
            image_kind=validation
          fi
          echo "image=${REGISTRY_IMAGE}:${image_kind}-${GITHUB_RUN_ID}" >> "${GITHUB_OUTPUT}"

      - name: Set exact release image
        if: ${{ steps.release.outputs.tag != '' }}
        run: echo "RELEASE_IMAGE=${REGISTRY_IMAGE}:${{ steps.release.outputs.tag }}" >> "${GITHUB_ENV}"

      - name: Record candidate source commit
        id: source
        run: echo "commit=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Reject an existing candidate tag
        run: |
          set -euo pipefail
          image="${{ steps.meta.outputs.image }}"
          if output="$(docker buildx imagetools inspect "${image}" 2>&1)"; then
            echo "Candidate tag already exists: ${image}" >&2
            exit 1
          fi
          if ! grep -Eqi 'not found|manifest unknown|no such manifest|404' <<< "${output}"; then
            echo "Unable to determine whether candidate tag exists:" >&2
            printf '%s\n' "${output}" >&2
            exit 1
          fi

      - name: Reject an existing exact release tag
        if: ${{ steps.release.outputs.tag != '' }}
        run: |
          set -euo pipefail
          if output="$(docker buildx imagetools inspect "${RELEASE_IMAGE}" 2>&1)"; then
            echo "Release image tag already exists: ${RELEASE_IMAGE}" >&2
            exit 1
          fi
          if ! grep -Eqi 'not found|manifest unknown|no such manifest|404' <<< "${output}"; then
            echo "Unable to determine whether release image tag exists:" >&2
            printf '%s\n' "${output}" >&2
            exit 1
          fi

      - name: Build and push candidate
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.image }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=release-candidate
          cache-to: type=gha,mode=max,scope=release-candidate

      - name: Record candidate evidence
        id: manifest
        env:
          PUBLISH_RC: ${{ github.event_name == 'push' || inputs.publish_rc }}
        run: |
          set -euo pipefail
          image="${{ steps.meta.outputs.image }}"
          manifest="$(docker buildx imagetools inspect "${image}" --raw)"
          printf '%s\n' "${manifest}" > "${RUNNER_TEMP}/candidate-manifest.json"
          platform_digests="$(jq -c '
            [.manifests[]
             | select(.platform.os == "linux")
             | select((.annotations["vnd.docker.reference.type"] // "") != "attestation-manifest")
             | {key: ("linux/" + .platform.architecture), value: .digest}]
            | from_entries
          ' "${RUNNER_TEMP}/candidate-manifest.json")"
          [[ "$(jq 'keys | sort' <<< "${platform_digests}")" == '["linux/amd64","linux/arm64"]' ]]
          echo "platform_digests=${platform_digests}" >> "${GITHUB_OUTPUT}"
          {
            if [[ "${PUBLISH_RC}" == "true" ]]; then
              echo "# Release candidate image"
            else
              echo "# Validation-only candidate image"
            fi
            echo
            echo "- Commit: \`${{ steps.source.outputs.commit }}\`"
            echo "- Image: \`${{ steps.meta.outputs.image }}\`"
            echo "- Manifest digest: \`${{ steps.build.outputs.digest }}\`"
            echo "- Native platform digests: \`${platform_digests}\`"
            echo "- Native validation: linux/amd64 and linux/arm64"
            echo "- Offline contract: full deterministic suite"
            echo "- Cache validation: explicit cache-hit trace"
          } | tee /tmp/release-candidate-evidence.md >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload candidate evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-candidate-${{ github.run_id }}
          path: |
            /tmp/release-candidate-evidence.md
            ${{ runner.temp }}/candidate-manifest.json
          retention-days: 90

  offline-native:
    needs: build-candidate
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            key: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            key: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.build-candidate.outputs.commit }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Pull candidate by manifest digest
        env:
          IMAGE: ${{ needs.build-candidate.outputs.image }}@${{ needs.build-candidate.outputs.digest }}
        run: |
          set -euo pipefail
          docker pull --platform "${{ matrix.platform }}" "${IMAGE}"
          echo "CANDIDATE_IMAGE=${IMAGE}" >> "${GITHUB_ENV}"
          platform_digest="$(docker buildx imagetools inspect "${IMAGE}" --raw | jq -r \
            --arg platform "${{ matrix.platform }}" \
            '.manifests[] | select((.platform.os + "/" + .platform.architecture) == $platform) | .digest')"
          [[ "${platform_digest}" == sha256:* ]]
          echo "PLATFORM_DIGEST=${platform_digest}" >> "${GITHUB_ENV}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            docker/requirements-core.txt
            carnivore-lib/setup.cfg

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          cache: npm
          cache-dependency-path: carnivore-lib/carnivore/readability/package-lock.json

      - name: Install deterministic offline test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -r requirements-dev.txt \
            -r docker/requirements-core.txt \
            -e carnivore-lib

      - name: Install Readability dependencies
        working-directory: carnivore-lib/carnivore/readability
        run: npm ci

      - name: Install browser dependencies
        run: playwright install --with-deps chromium

      - name: Install locked Pandoc
        env:
          PLATFORM_KEY: ${{ matrix.key }}
        run: |
          set -euo pipefail
          source docker/core.lock
          if [[ "${PLATFORM_KEY}" == "amd64" ]]; then
            pandoc_arch=amd64
            pandoc_sha256="${PANDOC_SHA256_AMD64}"
          else
            pandoc_arch=arm64
            pandoc_sha256="${PANDOC_SHA256_ARM64}"
          fi
          curl -fsSL \
            "${PANDOC_DOWNLOAD_BASE}/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-linux-${pandoc_arch}.tar.gz" \
            -o /tmp/pandoc.tar.gz
          printf '%s  %s\n' "${pandoc_sha256}" /tmp/pandoc.tar.gz | sha256sum -c -
          sudo tar -xzf /tmp/pandoc.tar.gz -C /usr/local --strip-components=1

      - name: Install locked Monolith
        env:
          PLATFORM_KEY: ${{ matrix.key }}
        run: |
          set -euo pipefail
          source docker/core.lock
          if [[ "${PLATFORM_KEY}" == "amd64" ]]; then
            monolith_arch=x86_64
            monolith_sha256="${MONOLITH_SHA256_AMD64}"
          else
            monolith_arch=aarch64
            monolith_sha256="${MONOLITH_SHA256_ARM64}"
            libssl_url="${LIBSSL1_1_DOWNLOAD_BASE}/libssl1.1_${LIBSSL1_1_VERSION}_arm64.deb"
            curl -fsSL \
              "${libssl_url}" \
              -o /tmp/libssl1.1.deb
            printf '%s  %s\n' "${LIBSSL1_1_SHA256_ARM64}" /tmp/libssl1.1.deb | sha256sum -c -
            sudo dpkg --unpack /tmp/libssl1.1.deb
          fi
          curl -fsSL \
            "${MONOLITH_DOWNLOAD_BASE}/v${MONOLITH_VERSION}/monolith-gnu-linux-${monolith_arch}" \
            -o /tmp/monolith
          printf '%s  %s\n' "${monolith_sha256}" /tmp/monolith | sha256sum -c -
          sudo install -m 0755 /tmp/monolith /usr/local/bin/monolith

      - name: Run complete deterministic offline suite
        env:
          CARNIVORE_CACHE: "0"
        run: scripts/run-tests.sh

      - name: Start deterministic fixture server
        run: |
          python3 tests/acceptance/fixture_server.py --port 18080 > /tmp/fixture.log 2>&1 &
          echo "FIXTURE_PID=$!" >> "${GITHUB_ENV}"
          for attempt in $(seq 1 20); do
            if python3 -c 'import socket; socket.create_connection(("127.0.0.1", 18080), 1).close()' 2>/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/fixture.log >&2
          exit 1

      - name: Verify candidate output contract and cache evidence
        run: |
          set -euo pipefail
          evidence="${RUNNER_TEMP}/offline-${{ matrix.key }}.md"
          CACHE_VOLUME=""
          trap 'kill "${FIXTURE_PID}" 2>/dev/null || true; docker volume rm "${CACHE_VOLUME}" >/dev/null 2>&1 || true' EXIT
          markdown="$(docker run --rm --platform "${{ matrix.platform }}" --network host "${CANDIDATE_IMAGE}" \
            http://127.0.0.1:18080/resources --format markdown --resource-mode omit)"
          [[ "${markdown}" == *"Resource fixture article"* ]]
          [[ "${markdown}" != *"pixel.png"* ]]

          html="$(docker run --rm --platform "${{ matrix.platform }}" --network host "${CANDIDATE_IMAGE}" \
            http://127.0.0.1:18080/resources --format html --resource-mode link)"
          [[ "${html}" == *"pixel.png"* ]]

          full_html="$(docker run --rm --platform "${{ matrix.platform }}" --network host "${CANDIDATE_IMAGE}" \
            http://127.0.0.1:18080/resources --format full_html --resource-mode embed)"
          [[ "${full_html}" == *"data:image/png;base64,"* ]]

          CACHE_VOLUME="carnivore-rc-cache-${GITHUB_RUN_ID}-${{ matrix.key }}"
          docker volume create "${CACHE_VOLUME}" >/dev/null
          cache_url=http://127.0.0.1:18080/article
          docker run --rm --platform "${{ matrix.platform }}" --network host \
            --mount "type=volume,source=${CACHE_VOLUME},destination=/cache" \
            --env CARNIVORE_CACHE=1 --env CARNIVORE_CACHE_DIR=/cache \
            "${CANDIDATE_IMAGE}" "${cache_url}" --output json > "${RUNNER_TEMP}/cache-first.json"
          docker run --rm --platform "${{ matrix.platform }}" --network host \
            --mount "type=volume,source=${CACHE_VOLUME},destination=/cache" \
            --env CARNIVORE_CACHE=1 --env CARNIVORE_CACHE_DIR=/cache \
            --env CARNIVORE_CACHE_TRACE=1 \
            "${CANDIDATE_IMAGE}" "${cache_url}" --output json \
            > "${RUNNER_TEMP}/cache-second.json" 2> "${RUNNER_TEMP}/cache-trace.log"
          cmp "${RUNNER_TEMP}/cache-first.json" "${RUNNER_TEMP}/cache-second.json"
          grep -Fxq cache_hit "${RUNNER_TEMP}/cache-trace.log"

          identity_html="$(docker run --rm --platform "${{ matrix.platform }}" \
            --network host "${CANDIDATE_IMAGE}" \
            http://127.0.0.1:18080/identity --format full_html --resource-mode link)"
          identity_evidence="$(printf '%s' "${identity_html}" | \
            python3 scripts/verify_stealth_evidence.py identity)"
          source docker/core.lock
          runtime_metadata="$(docker run --rm --platform "${{ matrix.platform }}" \
            --entrypoint python "${CANDIDATE_IMAGE}" -c \
            'from pathlib import Path; import importlib.metadata as m, json; lock=dict(line.split("=", 1) for line in Path("/opt/carnivore/core.lock").read_text().splitlines() if "=" in line); requirement=next(line for line in Path("/opt/carnivore/requirements-core.txt").read_text().splitlines() if line.startswith("playwright-stealth==")); d=m.distribution("playwright-stealth"); print(json.dumps({"version": d.version, "license": d.metadata.get("License", ""), "wheel_sha256": lock["PLAYWRIGHT_STEALTH_WHEEL_SHA256"], "source_commit": lock["PLAYWRIGHT_STEALTH_SOURCE_COMMIT"], "requirement": requirement}))')"
          runtime_evidence="$(printf '%s' "${runtime_metadata}" | \
            python3 scripts/verify_stealth_evidence.py runtime \
              --version "${PLAYWRIGHT_STEALTH_VERSION}" \
              --wheel-sha256 "${PLAYWRIGHT_STEALTH_WHEEL_SHA256}" \
              --source-commit "${PLAYWRIGHT_STEALTH_SOURCE_COMMIT}" \
              --license "${PLAYWRIGHT_STEALTH_LICENSE}")"
          jq -n \
            --arg platform "${{ matrix.platform }}" \
            --arg digest "${PLATFORM_DIGEST}" \
            --argjson identity "${identity_evidence}" \
            --argjson runtime "${runtime_evidence}" \
            '{platform: $platform, digest: $digest, identity: $identity.status, runtime: $runtime.status, runtime_version: $runtime.version, runtime_wheel_sha256: $runtime.wheel_sha256, runtime_source_commit: $runtime.source_commit, runtime_license: $runtime.license, runtime_requirement: $runtime.requirement}' \
            > "${RUNNER_TEMP}/stealth-${{ matrix.key }}.json"

          {
            echo "# Native offline evidence (${{ matrix.platform }})"
            echo
            echo "- Image: \`${CANDIDATE_IMAGE}\`"
            echo "- Full offline suite: passed"
            echo "- markdown + omit: passed"
            echo "- html + link: passed"
            echo "- full_html + embed: passed"
            echo "- cache hit: explicit cache_hit trace and byte-identical JSON"
            echo "- browser identity: passed"
            echo "- Stealth runtime metadata: passed"
          } | tee "${evidence}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload native offline evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-offline-${{ matrix.key }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/offline-${{ matrix.key }}.md
            ${{ runner.temp }}/stealth-${{ matrix.key }}.json
          if-no-files-found: error
          retention-days: 90

  live-smoke:
    needs: build-candidate
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/live-smoke.yml
    with:
      image: ${{ needs.build-candidate.outputs.image }}@${{ needs.build-candidate.outputs.digest }}
      ref: ${{ needs.build-candidate.outputs.commit }}
    secrets: inherit

  benchmark-initial:
    needs: build-candidate
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/benchmark.yml
    with:
      image: ${{ needs.build-candidate.outputs.image }}@${{ needs.build-candidate.outputs.digest }}
      ref: ${{ needs.build-candidate.outputs.commit }}
      label: initial
      enforce_gate: false
    secrets: inherit

  benchmark-confirm:
    needs: build-candidate
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/benchmark.yml
    with:
      image: ${{ needs.build-candidate.outputs.image }}@${{ needs.build-candidate.outputs.digest }}
      ref: ${{ needs.build-candidate.outputs.commit }}
      label: confirming
      enforce_gate: false
    secrets: inherit

  benchmark-gate:
    needs: [benchmark-initial, benchmark-confirm]
    if: always()
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require an independent confirming benchmark failure
        env:
          INITIAL_STATUS: ${{ needs.benchmark-initial.outputs.status }}
          CONFIRMING_STATUS: ${{ needs.benchmark-confirm.outputs.status }}
        run: |
          set -euo pipefail
          echo "Initial benchmark status: ${INITIAL_STATUS}"
          echo "Independent confirming benchmark status: ${CONFIRMING_STATUS}"
          if [[ "${INITIAL_STATUS}" != "0" && "${CONFIRMING_STATUS}" != "0" ]]; then
            echo "Both independent benchmark runs failed; blocking release candidate." >&2
            exit 1
          fi
          if [[ "${INITIAL_STATUS}" != "0" || "${CONFIRMING_STATUS}" != "0" ]]; then
            echo "One benchmark run failed, but the independent confirmation did not reproduce it."
          fi

  release-gate:
    needs: [build-candidate, offline-native, live-smoke, benchmark-gate]
    if: always()
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every release acceptance gate
        env:
          BUILD_RESULT: ${{ needs.build-candidate.result }}
          OFFLINE_RESULT: ${{ needs.offline-native.result }}
          LIVE_RESULT: ${{ needs.live-smoke.result }}
          BENCHMARK_RESULT: ${{ needs.benchmark-gate.result }}
        run: |
          set -euo pipefail
          for result in "${BUILD_RESULT}" "${OFFLINE_RESULT}" "${LIVE_RESULT}" "${BENCHMARK_RESULT}"; do
            if [[ "${result}" != "success" ]]; then
              echo "Release acceptance gate did not pass: ${result}" >&2
              exit 1
            fi
          done

  publish-rc:
    needs: [build-candidate, offline-native, live-smoke, benchmark-gate, release-gate]
    if: ${{ needs.release-gate.result == 'success' && (github.event_name == 'push' || inputs.publish_rc) }}
    permissions:
      contents: write
      packages: write
      attestations: write
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.build-candidate.outputs.commit }}
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Reject an existing GitHub release
        env:
          RELEASE_TAG: ${{ needs.build-candidate.outputs.release_tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" \
            > "${RUNNER_TEMP}/release.json" 2> "${RUNNER_TEMP}/release-error"; then
            echo "GitHub release already exists: ${RELEASE_TAG}" >&2
            exit 1
          fi
          if ! grep -Eqi '404|not found' "${RUNNER_TEMP}/release-error"; then
            cat "${RUNNER_TEMP}/release-error" >&2
            exit 1
          fi

      - name: Download native Stealth evidence
        uses: actions/download-artifact@v4
        with:
          pattern: release-offline-*-${{ github.run_id }}
          path: ${{ runner.temp }}/native-evidence
          merge-multiple: true

      - name: Require complete native Stealth evidence
        env:
          PLATFORM_DIGESTS: ${{ needs.build-candidate.outputs.platform_digests }}
        run: |
          set -euo pipefail
          source docker/core.lock
          for platform in linux/amd64 linux/arm64; do
            key="${platform##*/}"
            evidence="${RUNNER_TEMP}/native-evidence/stealth-${key}.json"
            test -s "${evidence}"
            jq -e \
              --arg platform "${platform}" \
              --arg digest "${PLATFORM_DIGESTS}" \
              --arg version "${PLAYWRIGHT_STEALTH_VERSION}" \
              --arg wheel_sha256 "${PLAYWRIGHT_STEALTH_WHEEL_SHA256}" \
              --arg source_commit "${PLAYWRIGHT_STEALTH_SOURCE_COMMIT}" \
              --arg license "${PLAYWRIGHT_STEALTH_LICENSE}" \
              --arg requirement "playwright-stealth==${PLAYWRIGHT_STEALTH_VERSION} --hash=sha256:${PLAYWRIGHT_STEALTH_WHEEL_SHA256}" \
              '(.platform == $platform) and (.digest == ($digest | fromjson)[$platform]) and (.identity == "passed") and (.runtime == "passed") and (.runtime_version == $version) and (.runtime_wheel_sha256 == $wheel_sha256) and (.runtime_source_commit == $source_commit) and (.runtime_license == $license) and (.runtime_requirement == $requirement)' \
              "${evidence}" >/dev/null
          done

      - name: Promote validated digest to exact RC tag
        env:
          RELEASE_TAG: ${{ needs.build-candidate.outputs.release_tag }}
          CANDIDATE_IMAGE: ${{ needs.build-candidate.outputs.image }}
          CANDIDATE_DIGEST: ${{ needs.build-candidate.outputs.digest }}
        run: |
          set -euo pipefail
          release_image="${REGISTRY_IMAGE}:${RELEASE_TAG}"
          if output="$(docker buildx imagetools inspect "${release_image}" 2>&1)"; then
            echo "Release image tag already exists: ${release_image}" >&2
            exit 1
          fi
          if ! grep -Eqi 'not found|manifest unknown|no such manifest|404' <<< "${output}"; then
            echo "Unable to determine whether release image tag exists:" >&2
            printf '%s\n' "${output}" >&2
            exit 1
          fi
          docker buildx imagetools create \
            --tag "${release_image}" \
            "${CANDIDATE_IMAGE}@${CANDIDATE_DIGEST}"

      - name: Verify promoted RC tag
        env:
          RELEASE_TAG: ${{ needs.build-candidate.outputs.release_tag }}
          EXPECTED_DIGEST: ${{ needs.build-candidate.outputs.digest }}
        run: |
          set -euo pipefail
          actual_digest="$(docker buildx imagetools inspect "${REGISTRY_IMAGE}:${RELEASE_TAG}" \
            --format '{{json .Manifest}}' | jq -r '.digest')"
          if [[ "${actual_digest}" != "${EXPECTED_DIGEST}" ]]; then
            echo "Promoted RC image digest mismatch: expected ${EXPECTED_DIGEST}, got ${actual_digest}" >&2
            exit 1
          fi

      - name: Collect release image facts
        id: facts
        env:
          RELEASE_TAG: ${{ needs.build-candidate.outputs.release_tag }}
          RELEASE_DIGEST: ${{ needs.build-candidate.outputs.digest }}
        run: |
          set -euo pipefail
          release_image="${REGISTRY_IMAGE}:${RELEASE_TAG}"
          manifest="$(docker buildx imagetools inspect "${release_image}" --raw)"
          platform_digests="$(jq -c '
            [.manifests[]
             | select(.platform.os == "linux")
             | select((.annotations["vnd.docker.reference.type"] // "") != "attestation-manifest")
             | {key: ("linux/" + .platform.architecture), value: .digest}]
            | from_entries
          ' <<< "${manifest}")"
          printf 'platform_digests=%s\n' "${platform_digests}" >> "${GITHUB_OUTPUT}"
          printf 'image=%s\n' "${release_image}" >> "${GITHUB_OUTPUT}"
          source docker/core.lock
          stealth_platforms="$(jq -s 'map({key: .platform, value: {digest: .digest, identity: .identity, runtime: .runtime}}) | from_entries' \
            "${RUNNER_TEMP}"/native-evidence/stealth-*.json)"
          jq -e --argjson expected "${platform_digests}" \
            'with_entries(.value = .value.digest) == $expected' \
            <<< "${stealth_platforms}" >/dev/null
          {
            jq -n \
              --arg workflow_run "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
              --arg candidate_digest "${RELEASE_DIGEST}" \
              --arg version "${PLAYWRIGHT_STEALTH_VERSION}" \
              --arg wheel_sha256 "${PLAYWRIGHT_STEALTH_WHEEL_SHA256}" \
              --arg source_commit "${PLAYWRIGHT_STEALTH_SOURCE_COMMIT}" \
              --arg license "${PLAYWRIGHT_STEALTH_LICENSE}" \
              --argjson platforms "${stealth_platforms}" \
              '{release_gate: "passed", offline_native: "passed", live_smoke: "passed", benchmark: "passed", cache: "verified", workflow_run: $workflow_run, candidate_digest: $candidate_digest, stealth: {version: $version, wheel_sha256: $wheel_sha256, source_commit: $source_commit, license: $license, platforms: $platforms}}'
          } > "${RUNNER_TEMP}/validation.json"

      - name: Build release assets
        env:
          RELEASE_TAG: ${{ needs.build-candidate.outputs.release_tag }}
          SOURCE_COMMIT: ${{ needs.build-candidate.outputs.commit }}
          RELEASE_DIGEST: ${{ needs.build-candidate.outputs.digest }}
          RELEASE_IMAGE: ${{ steps.facts.outputs.image }}
          PLATFORM_DIGESTS: ${{ steps.facts.outputs.platform_digests }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/release"
          python scripts/release.py package \
            --version "${RELEASE_TAG}" \
            --channel rc \
            --commit "${SOURCE_COMMIT}" \
            --image "${RELEASE_IMAGE}" \
            --digest "${RELEASE_DIGEST}" \
            --platform-digests "${PLATFORM_DIGESTS}" \
            --validation-json "${RUNNER_TEMP}/validation.json" \
            --workflow-run "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --output "${RUNNER_TEMP}/release"
          python scripts/release.py verify-manifest \
            --manifest "${RUNNER_TEMP}/release/release-manifest.json" \
            --tag "${RELEASE_TAG}" \
            --commit "${SOURCE_COMMIT}"

      - name: Attest release assets
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ runner.temp }}/release/*

      - name: Create GitHub prerelease
        env:
          RELEASE_TAG: ${{ needs.build-candidate.outputs.release_tag }}
          SOURCE_COMMIT: ${{ needs.build-candidate.outputs.commit }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --target "${SOURCE_COMMIT}" \
            --title "Carnivore ${RELEASE_TAG}" \
            --notes "Verified release candidate built from ${SOURCE_COMMIT}." \
            --prerelease \
            "${RUNNER_TEMP}/release"/*

      - name: Upload release evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-candidate-assets-${{ needs.build-candidate.outputs.release_tag }}
          path: ${{ runner.temp }}/release
          retention-days: 90
