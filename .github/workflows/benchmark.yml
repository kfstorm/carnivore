name: Offline Benchmark

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:
    inputs:
      image:
        description: "Optional image reference to benchmark"
        required: false
        default: ""
        type: string
      ref:
        description: "Git ref to benchmark"
        required: false
        default: ""
        type: string
      label:
        description: "Evidence label"
        required: false
        default: scheduled
        type: string
      enforce_gate:
        description: "Fail the workflow when strict comparison regresses"
        required: false
        default: true
        type: boolean
  workflow_call:
    inputs:
      image:
        description: "Optional image reference to benchmark"
        required: false
        default: ""
        type: string
      ref:
        description: "Git ref to benchmark"
        required: false
        default: ""
        type: string
      label:
        description: "Evidence label"
        required: false
        default: benchmark
        type: string
      enforce_gate:
        description: "Fail the workflow when strict comparison regresses"
        required: false
        default: true
        type: boolean
    outputs:
      status:
        description: "Exit status of the benchmark comparison"
        value: ${{ jobs.benchmark.outputs.status }}

permissions:
  contents: read
  packages: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      status: ${{ steps.execute.outputs.status }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            docker/requirements-core.txt
            carnivore-lib/setup.cfg

      - name: Install benchmark Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r docker/requirements-core.txt
          python -m pip install --no-deps -e carnivore-lib

      - name: Set up Node.js for source benchmark
        if: ${{ github.event_name == 'schedule' || inputs.image == '' }}
        uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          cache: npm
          cache-dependency-path: carnivore-lib/carnivore/readability/package-lock.json

      - name: Install source benchmark dependencies
        if: ${{ github.event_name == 'schedule' || inputs.image == '' }}
        working-directory: carnivore-lib/carnivore/readability
        run: npm ci

      - name: Install browser dependencies for source benchmark
        if: ${{ github.event_name == 'schedule' || inputs.image == '' }}
        run: playwright install --with-deps chromium

      - name: Install Pandoc for source benchmark
        if: ${{ github.event_name == 'schedule' || inputs.image == '' }}
        uses: pandoc/actions/setup@v1
        with:
          version: "3.10"

      - name: Install Monolith for source benchmark
        if: ${{ github.event_name == 'schedule' || inputs.image == '' }}
        env:
          MONOLITH_VERSION: 2.10.1
        run: |
          set -euo pipefail
          curl -fsSL \
            "https://github.com/Y2Z/monolith/releases/download/v${MONOLITH_VERSION}/monolith-gnu-linux-x86_64" \
            -o /tmp/monolith
          sudo install -m 0755 /tmp/monolith /usr/local/bin/monolith

      - name: Log in to GHCR for image benchmark
        if: ${{ inputs.image != '' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image for image benchmark
        if: ${{ inputs.image != '' }}
        env:
          REQUESTED_IMAGE: ${{ inputs.image }}
        run: docker pull --platform linux/amd64 "${REQUESTED_IMAGE}"

      - name: Run five benchmark iterations
        id: execute
        env:
          BENCHMARK_IMAGE: ${{ inputs.image }}
          BENCHMARK_LABEL: ${{ inputs.label }}
        run: |
          set -uo pipefail
          set +e
          label="${BENCHMARK_LABEL}"
          if [[ -z "${label}" ]]; then
            label="scheduled"
          fi
          label="${label//[^a-zA-Z0-9_.-]/-}"
          if [[ -z "${label}" ]]; then
            label="benchmark"
          fi
          printf 'artifact_suffix=%s\n' "${label}" >> "${GITHUB_OUTPUT}"
          source_commit="$(git rev-parse HEAD)"
          result_path="${RUNNER_TEMP}/benchmark-result.json"
          log_path="${RUNNER_TEMP}/benchmark-result.log"
          args=(
            --corpus benchmarks/corpus.yml
            --runs 5
            --baseline benchmarks/results/stable.json
            --out "${result_path}"
            --version "${source_commit}-${label}"
            --strict
          )
          if [[ -n "${BENCHMARK_IMAGE}" ]]; then
            args+=(--image "${BENCHMARK_IMAGE}")
          fi
          python scripts/benchmark.py "${args[@]}" 2>&1 | tee "${log_path}"
          pipeline_status=("${PIPESTATUS[@]}")
          status=${pipeline_status[0]}
          if [[ ${pipeline_status[1]:-1} -ne 0 ]]; then
            status=2
          fi
          if ! cat "${log_path}" >> "${GITHUB_STEP_SUMMARY}"; then
            status=2
          fi
          if [[ ! -s "${result_path}" ]]; then
            status=2
          fi
          if ! printf 'status=%s\n' "${status}" >> "${GITHUB_OUTPUT}"; then
            exit 1
          fi
          exit 0

      - name: Upload benchmark result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ steps.execute.outputs.artifact_suffix || 'benchmark' }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/benchmark-result.json
            ${{ runner.temp }}/benchmark-result.log
          if-no-files-found: warn
          retention-days: 90

  gate:
    needs: benchmark
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Enforce scheduled benchmark gate
        env:
          BENCHMARK_STATUS: ${{ needs.benchmark.outputs.status }}
          ENFORCE_GATE: ${{ inputs.enforce_gate }}
        run: |
          set -euo pipefail
          if [[ "${ENFORCE_GATE}" == "false" ]]; then
            exit 0
          fi
          if [[ "${BENCHMARK_STATUS}" != "0" ]]; then
            echo "Benchmark comparison failed with status ${BENCHMARK_STATUS}." >&2
            exit 1
          fi
