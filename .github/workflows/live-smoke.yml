name: Live Smoke

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      image:
        description: "Image reference to smoke (defaults to latest)"
        required: false
        default: ""
        type: string
  workflow_call:
    inputs:
      image:
        description: "Image reference to smoke"
        required: false
        default: "ghcr.io/kfstorm/carnivore:latest"
        type: string
      ref:
        description: "Git ref containing the smoke script"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  packages: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image
        env:
          REQUESTED_IMAGE: ${{ inputs.image }}
        run: |
          set -euo pipefail
          image="${REQUESTED_IMAGE}"
          if [[ -z "${image}" ]]; then
            image="ghcr.io/kfstorm/carnivore:latest"
          fi
          docker pull --platform linux/amd64 "${image}"
          echo "CARNIVORE_IMAGE=${image}" >> "${GITHUB_ENV}"

      - name: Run three-page smoke with consecutive retries
        run: |
          scripts/live-smoke.sh \
            --image "${CARNIVORE_IMAGE}" \
            --output "${RUNNER_TEMP}/live-smoke-evidence.md"

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/live-smoke-evidence.md
          if-no-files-found: error
          retention-days: 30
